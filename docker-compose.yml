# RotaAI — system-level wiring (docs/06-infra-devops.md §2).
# MVP single-host stack: PostGIS + Redis + FastAPI (api) + Celery (worker).
# Review console (05) and mobile (01) join later.
#
#   docker compose up --build
#   API:      http://localhost:8000/docs
#   Postgres: localhost:5432 (rotaai/rotaai)

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://rotaai:rotaai@db:5432/rotaai
  REDIS_URL: redis://redis:6379/0
  STORAGE_DIR: /data/images
  DETECT_CONF: "0.4"
  # WEIGHTS_PATH: /models/best.pt   # <- set once Stage-1 weights exist (real model)
  DETECTOR_VERSION: stub-0

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rotaai
      POSTGRES_PASSWORD: rotaai
      POSTGRES_DB: rotaai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro   # runs 01_schema.sql on first init
    ports:
      - "5434:5432"   # host 5434 → avoids clashing with a native/other postgres on 5432/5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rotaai"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # internal-only (no host port) — api/worker reach it over the compose network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment: *backend-env
    volumes:
      - images:/data/images        # shared with worker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment: *backend-env
    volumes:
      - images:/data/images        # reads the same images the api wrote
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  images:
